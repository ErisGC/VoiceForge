version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: voiceforge-postgres
    environment:
      POSTGRES_DB: voiceforge
      POSTGRES_USER: voiceforge
      POSTGRES_PASSWORD: voiceforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: voiceforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: voiceforge-api
    env_file:
      - .env
    environment:
      VF_STORAGE_ROOT: /workspace/data/storage
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    container_name: voiceforge-worker
    env_file:
      - .env
    environment:
      VF_STORAGE_ROOT: /workspace/data/storage
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/workspace

volumes:
  postgres_data:
  redis_data:

